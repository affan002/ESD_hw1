# Prometheus configuration for the sensor ingestion stack.
# Mounted read-only into the prometheus container at /etc/prometheus/prometheus.yml.

global:
  # 5 s (Prometheus's default is 1 m) so experiments show changes within seconds,
  # and rate(...[1m]) always has ~12 samples to work with.
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  # The FastAPI app: HTTP, ingestion, device-status and process metrics.
  - job_name: sensor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Node Exporter runs on the host network (see docker-compose.yml), so it is
  # reached through the Docker host gateway rather than by service name.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Prometheus's own metrics (scrape health, TSDB size, series count).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Loads every dashboard JSON in /etc/grafana/dashboards (mounted from
# monitoring/grafana/dashboards). The files are the source of truth: UI edits
# can't be saved, so change the JSON and Grafana picks it up within 30 s.
apiVersion: 1

providers:
  - name: sensor-dashboards
    folder: Sensor Ingestion
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards

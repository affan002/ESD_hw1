# Docker's json-file log driver with rotation: at most 3 files x 10 MB per
# container. Filebeat (Part C) reads these files; they're a short-term buffer,
# and Elasticsearch is the long-term store.
x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    image: sensor-api:dev
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/sensors.db
      LOG_LEVEL: INFO
      STALE_AFTER_S: "30"
    volumes:
      - sensor-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *app-logging

  simulator:
    image: sensor-api:dev
    command: ["python", "-m", "simulator.simulate"]
    environment:
      API_URL: http://api:8000
      SIM_DEVICES: "20"
      SIM_INTERVAL_S: "5"
      SIM_SEED: "42"
    depends_on:
      api:
        condition: service_healthy
    logging: *app-logging

  # ---------- Metrics (Part B) ----------

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Lets Prometheus reach node-exporter, which listens on the host's network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

  # Host metrics (CPU, memory, disk, network) for the machine running Docker.
  # Host network and PID namespaces plus a read-only mount of / make it measure
  # the host itself rather than its own container.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave

  # Dashboards and the Prometheus datasource are provisioned from files in
  # monitoring/grafana, so the setup is reproducible with no manual clicking.
  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3000:3000"
    environment:
      # Local use only: anyone who can reach port 3000 can view dashboards without
      # logging in. Editing needs the admin login (admin/admin on first start).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sensor-service.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------- Logs (Part C) ----------

  # Single-node Elasticsearch for the log pipeline. Security is off for local
  # use, so the port is bound to 127.0.0.1 only (not reachable from the LAN).
  elasticsearch:
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      cluster.name: sensor-logs
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # Search UI for the logs. Data view and saved searches are imported by
  # logs-setup from monitoring/kibana/saved-objects.ndjson (no clicking).
  kibana:
    image: kibana:9.5.3
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_OPTIN: "false"
      NEWSFEED_ENABLED: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"  # with optIn=false this hides the "Help us improve" banner
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot job: retention policy + index template in Elasticsearch, then the
  # Kibana data view and saved searches. Idempotent; exits when done.
  logs-setup:
    image: curlimages/curl:8.16.0
    entrypoint: ["/bin/sh", "/monitoring/logs-setup.sh"]
    volumes:
      - ./monitoring:/monitoring:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  # Tails the api and simulator containers' Docker log files and ships them to
  # Elasticsearch. Runs as root (Docker's log files are root-only) with
  # read-only mounts; --strict.perms=false because the config file is owned by
  # the host user, not root.
  filebeat:
    image: elastic/filebeat:9.5.3
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      logs-setup:
        condition: service_completed_successfully

volumes:
  sensor-data:
  prometheus-data:
  grafana-data:
  es-data:
  filebeat-data:
